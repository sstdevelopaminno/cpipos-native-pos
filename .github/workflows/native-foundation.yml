name: Native Foundation Build

on:
  push:
    branches:
      - "bootstrap/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Enforce 100% Native Android UI (no WebView POS wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'import android[.]webkit[.]WebView|WebView[[:space:]]*\(|[.]loadUrl[[:space:]]*\(' \
            --include='*.kt' --include='*.java' app/src/main/java; then
            echo "::error::CpiPOS Native 2.0 forbids WebView and webpage-based POS screens. Use Kotlin/Jetpack Compose with shared backend JSON APIs."
            exit 1
          fi
          echo "Verified: no WebView embedding in Android app source."

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: cpipos-native-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
