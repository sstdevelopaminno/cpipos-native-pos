name: Verify Native Release Variant

on:
  push:
    branches:
      - "feature/native-release-unsigned-verify-20261027"

permissions:
  contents: read

jobs:
  release-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Unit test and assemble unsigned release
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace \
            -PCPIPOS_RELEASE_VERSION_NAME="2.0.0" \
            -PCPIPOS_RELEASE_VERSION_CODE="2000000"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print
      - name: Upload release-variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpipos-native-release-variant-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
          if-no-files-found: error
