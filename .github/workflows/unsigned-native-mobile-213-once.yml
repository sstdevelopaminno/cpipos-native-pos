name: Build Native Mobile 2.1.3 unsigned QA from reviewed commit (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/unsigned-native-mobile-213-once.yml]
permissions:
  contents: read
jobs:
  build-unsigned-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Pin reviewed Android source from passing tests
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 35867cb81edc47ae865a806acd3c820bd5dfbb65
          git checkout --detach 35867cb81edc47ae865a806acd3c820bd5dfbb65
          test "$(git rev-parse HEAD)" = 35867cb81edc47ae865a806acd3c820bd5dfbb65
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - name: Set up Gradle from Native repository cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Build unsigned non-debuggable release variant
        run: |
          set -euo pipefail
          printf '%s\n' \
            "CPIPOS_WEB_POS_API_URL=https://pos.cuttingpointinnovation.com" \
            "CPIPOS_SUPABASE_URL=https://deejlitaivfnsbwqdugy.supabase.co" \
            "CPIPOS_SUPABASE_PUBLISHABLE_KEY=sb_publishable_nGX5abZtEmd7Ynzyofop1A_caORaUII" \
            > local.properties
          chmod 600 local.properties
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace \
            -PCPIPOS_RELEASE_VERSION_NAME=2.1.3 \
            -PCPIPOS_RELEASE_VERSION_CODE=2013000
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p qa-artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk qa-artifacts/CpIPOS-Native-Mobile-2.1.3-unsigned.apk
          sha256sum qa-artifacts/CpIPOS-Native-Mobile-2.1.3-unsigned.apk \
            | tee qa-artifacts/CpIPOS-Native-Mobile-2.1.3-unsigned.sha256
      - name: Upload unsigned binary ONLY to CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpipos-native-mobile-2-1-3-unsigned-reviewed-source
          path: qa-artifacts/
          retention-days: 7
          if-no-files-found: error
