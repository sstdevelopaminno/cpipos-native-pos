name: Native Mobile Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Public version, e.g. 2.0.0"
        required: true
        default: "2.0.0"
      version_code:
        description: "Monotonic Android versionCode"
        required: true
        default: "2000000"
      release_tag:
        description: "GitHub release tag"
        required: true
        default: "native-mobile-v2.0.0"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Android production signing secrets are not configured."
              exit 1
            fi
          done

      - name: Materialize production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cpipos-native-release.jks"
          chmod 600 "$RUNNER_TEMP/cpipos-native-release.jks"

      - name: Test and build signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-native-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace \
            -PCPIPOS_RELEASE_VERSION_NAME="${{ inputs.version_name }}" \
            -PCPIPOS_RELEASE_VERSION_CODE="${{ inputs.version_code }}"
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
            "release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.apk"
          sha256sum "release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.apk" \
            | tee "release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.sha256"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpipos-native-mobile-${{ inputs.version_name }}
          path: |
            release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.apk
            release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          APK="release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.apk"
          SUM="release/CpIPOS-Native-Mobile-${{ inputs.version_name }}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --target "$GITHUB_SHA" \
              --title "CpIPOS Native Mobile v${{ inputs.version_name }}" \
              --notes "Signed Android Native POS release. Minimum Android version: 8.0 (API 26)."
          fi
