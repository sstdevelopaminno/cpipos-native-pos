name: Probe Native Signing Secrets

on:
  push:
    branches:
      - "probe/native-signing-secrets-20261027"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate signing secrets presence
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$KEYSTORE_BASE64" ] || missing=1
          [ -n "$STORE_PASSWORD" ] || missing=1
          [ -n "$KEY_ALIAS" ] || missing=1
          [ -n "$KEY_PASSWORD" ] || missing=1
          if [ "$missing" -ne 0 ]; then
            echo "::error::Native Android production signing secrets are incomplete."
            exit 1
          fi
          echo "Native Android production signing secrets are configured."
